# The Kaggle runner works through these jobs in order.
# - It skips jobs that are done, running in another session, or waiting for
#   another job, and jobs that need a different kind of session (gpu / cpu).
# - Job names are permanent: they name the folder on the `results` branch and
#   on the Hugging Face Hub. Never reuse a name for a different experiment.
# Status of every job: see results/<job>/status.json on the `results` branch.

settings:
  session_hours: 11        # stop cleanly this long after the notebook started
  stop_margin_minutes: 20  # training stops this long before that, to save and upload
  hf_data_repo: gptlab-data
  hf_ckpt_repo: gptlab-checkpoints
  hf_private: false

jobs:
  # 1. Check the whole pipeline end to end and measure speed (GPU T4 x2, ~1 hour).
  #    (The first attempt, "smoke", hung for 7 hours in its data step: forked
  #    worker processes deadlocked. Fixed; this is the second attempt.)
  - name: smoke-2
    kind: smoke
    config: configs/smoke/smoke.yaml
    hardware: gpu
    max_attempts: 1        # if it fails, the logs say why; no point burning a second GPU hour
    max_hours: 2           # safety limit, so a bug can never eat the weekly GPU quota again

  # 2. Build the real token dataset (CPU session: free, no GPU hours; ~1-3 hours).
  - name: data-fineweb-edu-16k
    kind: data
    config: configs/data/fineweb_edu_16k.yaml
    hardware: cpu
    max_hours: 8

  # ---- Experiments (plan and budget: EXPERIMENTS.md) ----
  # Stage 1: speed questions and learning-rate sweeps (~4.5 GPU hours in all).

  # D. Efficiency benchmark (~20 min). Needs no dataset, so it can run first.
  - name: bench-efficiency
    kind: bench
    config: configs/bench/efficiency.yaml
    hardware: gpu
    max_hours: 1

  # A. Learning-rate sweeps on s1, s2, s3 at 20 tokens per parameter.
  #    About 6 min per s1 run, 16 min per s2 run, 1 hour per s3 run.
  - name: s1-lr1e-3
    kind: train
    config: configs/exp/s1-lr1e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 0.75
  - name: s1-lr2e-3
    kind: train
    config: configs/exp/s1-lr2e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 0.75
  - name: s1-lr4e-3
    kind: train
    config: configs/exp/s1-lr4e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 0.75
  - name: s1-lr8e-3
    kind: train
    config: configs/exp/s1-lr8e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 0.75
  - name: s1-lr1.6e-2
    kind: train
    config: configs/exp/s1-lr1.6e-2.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 0.75
  - name: s2-lr1e-3
    kind: train
    config: configs/exp/s2-lr1e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 1
  - name: s2-lr2e-3
    kind: train
    config: configs/exp/s2-lr2e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 1
  - name: s2-lr4e-3
    kind: train
    config: configs/exp/s2-lr4e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 1
  - name: s2-lr8e-3
    kind: train
    config: configs/exp/s2-lr8e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 1
  - name: s3-lr1e-3
    kind: train
    config: configs/exp/s3-lr1e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 2.5
  - name: s3-lr2e-3
    kind: train
    config: configs/exp/s3-lr2e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 2.5
  - name: s3-lr4e-3
    kind: train
    config: configs/exp/s3-lr4e-3.yaml
    hardware: gpu
    after: [data-fineweb-edu-16k]
    max_hours: 2.5
